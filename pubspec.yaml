name: yakkit_calorie_tracker
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: 5.5.1
  cloud_firestore: 5.6.5
  provider: 6.1.2
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.0.14
  intl: ^0.17.0
  image_picker: ^0.8.7

  flutter_local_notifications: ^19.2.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.0
  permission_handler: ^12.0.0+1
  device_info_plus: ^11.4.0

  # secure storage
  #flutter_secure_storage_linux: ^2.0.1
  #flutter_secure_storage_windows: ^4.0.0

  # path provider
  #path_provider_linux: ^2.2.1
  #path_provider_windows: ^2.2.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^3.0.0

flutter_icons:
  android: true      # Android için ikon üretimi aktif
  ios: false         # iOS istemiyorsanız false bırakın
  image_path: "assets/launcher_icon.png"  # Kaynak ikon dosyanız
flutter:
  assets:
    - assets/filtered_food_data.csv
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.

  uses-material-design: true

