import java.util.Properties

plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '1')
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0')

android {
    namespace "com.example.yakkit_calorie_tracker"
    compileSdk flutter.compileSdkVersion
    ndkVersion "27.2.12479018"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.yakkit_calorie_tracker"
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
// Dosyanın en altına ekleyin (flutter { ... } / dependencies {} bloklarından sonra)

afterEvaluate {
    tasks.named("assembleDebug") {
        finalizedBy("copyDebugApk")
    }
}

tasks.register("copyDebugApk", Copy) {
    from("$buildDir/outputs/apk/debug/app-debug.apk")
    //into("$rootDir/../build/app/outputs/flutter-apk")
    into("${rootProject.projectDir}/../build/app/outputs/flutter-apk")
    rename { "app-debug.apk" }
}

